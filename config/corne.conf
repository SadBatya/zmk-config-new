# Display (nice!view sharp memory display)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y

CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# Bluetooth name
CONFIG_ZMK_KEYBOARD_NAME="Denis Keyboard"

# Display off after 2 minutes of idle
CONFIG_ZMK_IDLE_TIMEOUT=120000

# Deep sleep after 30 minutes
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# BLE: стабильность соединения между половинами
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
